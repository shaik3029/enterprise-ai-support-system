<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Sign In | SupportAI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033;min-height:100vh;display:grid;place-items:center}.box{width:min(440px,92vw);background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:34px;box-shadow:0 15px 45px rgba(20,30,60,.08)}.brand{text-align:center;margin-bottom:28px}.logo{width:46px;height:46px;border-radius:13px;background:#315eea;color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:22px}.brand h1{margin:0;font-size:24px}.brand p{margin:6px 0 0;color:#718096;font-size:12px}.badge{display:inline-block;background:#eef2ff;color:#315eea;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:700;margin-bottom:20px}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #d7deea;border-radius:9px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#315eea;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:12px;color:#c53030;font-size:12px;text-align:center}.back{text-align:center;margin-top:18px;font-size:12px}.back a{color:#315eea;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<div class="brand"><div class="logo">✦</div><h1>SupportAI</h1><p>Enterprise Administration Console</p></div>
<div class="badge">ADMINISTRATOR ACCESS</div>
<form id="form">
<label>Admin User ID</label><input id="userId" required placeholder="Enter admin user ID">
<label>Password</label><input id="password" type="password" required placeholder="Enter admin password">
<button id="btn">Sign In as Administrator</button>
<div class="msg" id="msg"></div>
</form>
<div class="back"><a href="/login.html">← Back to customer login</a></div>
</div>
<script>
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();const msg=document.getElementById("msg"),btn=document.getElementById("btn");msg.textContent="";btn.disabled=true;
 try{
  const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:document.getElementById("userId").value.trim(),password:document.getElementById("password").value})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.detail||"Login failed");
  if(d.user.role!=="ADMIN")throw new Error("This account does not have administrator access.");
  localStorage.setItem("access_token",d.access_token);localStorage.setItem("user",JSON.stringify(d.user));
  sessionStorage.removeItem("access_token");sessionStorage.removeItem("user");
  location.href="/admin/dashboard.html";
 }catch(e){msg.textContent=e.message;btn.disabled=false;}
});
</script>
</body>
</html>
