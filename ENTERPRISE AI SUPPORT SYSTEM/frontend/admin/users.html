<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management | Enterprise AI Support</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Inter, Arial, sans-serif;
            color: #172033;
        }

        .users-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-header p {
            margin: 8px 0 0;
            color: #697386;
        }

        .create-admin-btn {
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .create-admin-btn:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(20, 30, 50, 0.06);
        }

        .stat-label {
            color: #697386;
            font-size: 14px;
        }

        .stat-value {
            margin-top: 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .users-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(20, 30, 50, 0.06);
            overflow: hidden;
        }

        .card-header {
            padding: 22px;
            border-bottom: 1px solid #edf0f5;
        }

        .card-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #edf0f5;
            white-space: nowrap;
        }

        th {
            background: #fafbfc;
            color: #697386;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        td {
            font-size: 14px;
        }

        .user-name {
            font-weight: 600;
        }

        .user-id {
            color: #7a8496;
            font-size: 12px;
            margin-top: 3px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-admin {
            background: #ede9fe;
            color: #6d28d9;
        }

        .badge-customer {
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge-active {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-blocked {
            background: #fee2e2;
            color: #b91c1c;
        }

        .action-btn {
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .block-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .unblock-btn {
            background: #dcfce7;
            color: #15803d;
        }

        .protected {
            color: #8a93a3;
            font-size: 12px;
        }

        .loading,
        .empty {
            padding: 40px;
            text-align: center;
            color: #697386;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-box h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #d8dee8;
            border-radius: 9px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        .cancel-btn {
            border: 1px solid #d8dee8;
            background: white;
            color: #374151;
            border-radius: 9px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .submit-btn {
            border: 0;
            background: #2563eb;
            color: white;
            border-radius: 9px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 700px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .users-page {
                padding: 24px 14px;
            }
        }
    </style>
</head>

<body>

<div class="users-page">

    <div class="page-header">
        <div>
            <h1>User Management</h1>
            <p>Manage customer accounts and administrator access.</p>
        </div>

        <button
            class="create-admin-btn"
            onclick="openAdminModal()">
            + Create Admin
        </button>
    </div>

    <div id="message" class="message"></div>

    <div class="stats">

        <div class="stat-card">
            <div class="stat-label">Total Users</div>
            <div id="totalUsers" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Customers</div>
            <div id="totalCustomers" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Administrators</div>
            <div id="totalAdmins" class="stat-value">0</div>
        </div>

    </div>

    <div class="users-card">

        <div class="card-header">
            <h2>Registered Users</h2>
        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>User</th>
                        <th>Plan</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="usersTableBody">

                    <tr>
                        <td colspan="5" class="loading">
                            Loading users...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- CREATE ADMIN MODAL -->

<div id="adminModal" class="modal">

    <div class="modal-box">

        <h2>Create Admin Account</h2>

        <form id="adminForm">

            <div class="form-group">
                <label>Admin ID</label>
                <input
                    type="text"
                    id="adminUserId"
                    placeholder="ADMIN03"
                    required>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="adminName"
                    placeholder="Administrator Name"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Minimum 6 characters"
                    required>
            </div>

            <div class="form-group">
                <label>Plan</label>
                <input
                    type="text"
                    id="adminPlan"
                    value="Admin Enterprise"
                    required>
            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeAdminModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="submit-btn">
                    Create Admin
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const API_BASE = "";


// ==========================================
// AUTH TOKEN
// ==========================================

function getToken() {
    return (
        localStorage.getItem("access_token") ||
        sessionStorage.getItem("access_token")
    );
}


// ==========================================
// LOAD USERS
// ==========================================

async function loadUsers() {

    const token = getToken();

    if (!token) {
        window.location.href = "/login.html";
        return;
    }

    const tableBody =
        document.getElementById("usersTableBody");

    try {

        const response = await fetch(
            `${API_BASE}/api/admin/users`,
            {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (response.status === 401 ||
            response.status === 403) {

            window.location.href = "/login.html";
            return;
        }

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Failed to load users."
            );
        }

        renderUsers(data.users);

    } catch (error) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

    }
}


// ==========================================
// RENDER USERS
// ==========================================

function renderUsers(users) {

    const tableBody =
        document.getElementById("usersTableBody");

    const totalUsers =
        document.getElementById("totalUsers");

    const totalCustomers =
        document.getElementById("totalCustomers");

    const totalAdmins =
        document.getElementById("totalAdmins");


    totalUsers.textContent = users.length;

    totalCustomers.textContent =
        users.filter(
            user => user.role === "CUSTOMER"
        ).length;

    totalAdmins.textContent =
        users.filter(
            user => user.role === "ADMIN"
        ).length;


    if (!users.length) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    No users found.
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML = users.map(user => {

        const isAdmin =
            String(user.role).toUpperCase() === "ADMIN";

        const isBlocked =
            String(user.status).toUpperCase() === "BLOCKED";


        let action = "";

        if (isAdmin) {

            action = `
                <span class="protected">
                    Protected
                </span>
            `;

        } else {

            action = isBlocked

                ? `
                    <button
                        class="action-btn unblock-btn"
                        onclick="changeStatus(
                            '${escapeJs(user.user_id)}',
                            'Active'
                        )">
                        Unblock
                    </button>
                `

                : `
                    <button
                        class="action-btn block-btn"
                        onclick="changeStatus(
                            '${escapeJs(user.user_id)}',
                            'Blocked'
                        )">
                        Block
                    </button>
                `;
        }


        return `
            <tr>

                <td>
                    <div class="user-name">
                        ${escapeHtml(user.name)}
                    </div>

                    <div class="user-id">
                        ${escapeHtml(user.user_id)}
                    </div>
                </td>

                <td>
                    ${escapeHtml(
                        user.plan || "Standard Plan"
                    )}
                </td>

                <td>
                    <span class="badge ${
                        isAdmin
                            ? "badge-admin"
                            : "badge-customer"
                    }">
                        ${escapeHtml(user.role)}
                    </span>
                </td>

                <td>
                    <span class="badge ${
                        isBlocked
                            ? "badge-blocked"
                            : "badge-active"
                    }">
                        ${escapeHtml(user.status)}
                    </span>
                </td>

                <td>
                    ${action}
                </td>

            </tr>
        `;

    }).join("");
}


// ==========================================
// BLOCK / UNBLOCK
// ==========================================

async function changeStatus(userId, newStatus) {

    const token = getToken();

    try {

        const response = await fetch(
            `${API_BASE}/api/admin/users/${encodeURIComponent(userId)}/status`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify({
                    status: newStatus
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Unable to update user status."
            );
        }


        showMessage(
            data.message,
            "success"
        );

        await loadUsers();

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );

    }
}


// ==========================================
// CREATE ADMIN
// ==========================================

document
    .getElementById("adminForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const token = getToken();

        const userId =
            document.getElementById("adminUserId").value.trim();

        const name =
            document.getElementById("adminName").value.trim();

        const password =
            document.getElementById("adminPassword").value;

        const plan =
            document.getElementById("adminPlan").value.trim();


        try {

            const response = await fetch(
                `${API_BASE}/api/admin/users`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        user_id: userId,
                        name: name,
                        password: password,
                        plan: plan
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Failed to create admin."
                );
            }


            closeAdminModal();

            document
                .getElementById("adminForm")
                .reset();

            document
                .getElementById("adminPlan")
                .value = "Admin Enterprise";


            showMessage(
                "Admin account created successfully.",
                "success"
            );

            await loadUsers();

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    });


// ==========================================
// MODAL
// ==========================================

function openAdminModal() {

    document
        .getElementById("adminModal")
        .classList.add("show");
}


function closeAdminModal() {

    document
        .getElementById("adminModal")
        .classList.remove("show");
}


// ==========================================
// MESSAGE
// ==========================================

function showMessage(message, type) {

    const element =
        document.getElementById("message");

    element.textContent = message;

    element.className =
        `message ${type}`;

    setTimeout(() => {

        element.className = "message";

    }, 3500);
}


// ==========================================
// SECURITY HELPERS
// ==========================================

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeJs(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


// ==========================================
// START
// ==========================================

loadUsers();

</script>

</body>
</html>
